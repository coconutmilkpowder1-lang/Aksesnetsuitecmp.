<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AksesNetSuiteCMP</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{
    background:#F4F6F9;
    padding:20px;
}


.container{

    width:100%;
    max-width:420px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);

}


h2{

    text-align:center;
    color:#205081;
    margin-bottom:25px;

}


select{

    width:100%;
    height:45px;
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:16px;

}


.menu{

    display:block;
    margin-top:15px;
    padding:15px;
    background:#205081;
    color:white;
    text-align:center;
    text-decoration:none;
    border-radius:10px;
    font-weight:bold;
    font-size:16px;

}


.menu:hover{

    background:#3B82C4;

}


</style>

</head>


<body>


<div class="container">


<h2>🔐 AksesNetSuiteCMP</h2>


<select id="formula" onchange="tampil()">

<option value="">Pilih Formula / Item</option>

</select>


<div id="menu"></div>


</div>



<script>


// ===============================
// DATA FORMULA
// TAMBAH FORMULA DI SINI
// ===============================


const formula = {


"CMP 200":{

"📦 Inventory":
"https://URL-INVENTORY-CMP200",

"🔄 Transfer Inventory":
"https://URL-TRANSFER-CMP200"

},



"ND90":{

"📦 Inventory":
"https://URL-INVENTORY-ND90",

"🔄 Transfer Inventory":
"https://URL-TRANSFER-ND90"

},



"CREAM 500":{

"📦 Inventory":
"https://URL-INVENTORY-CREAM500",

"🔄 Transfer Inventory":
"https://URL-TRANSFER-CREAM500"

}


};




// ===============================
// MENU TETAP
// TAMBAH MENU UMUM DI SINI
// ===============================


const menuTetap = {


"🔍 Cek Item":
"https://URL-CEK-ITEM",


"📋 Cek WO":
"https://URL-CEK-WO",


"📑 Cek BOM":
"https://URL-CEK-BOM",


"📊 Report":
"https://URL-REPORT"


};





// Membuat pilihan formula otomatis


let pilih=document.getElementById("formula");


for(let item in formula){


let option=document.createElement("option");

option.value=item;

option.text=item;

pilih.appendChild(option);


}






function tampil(){


let nama=document.getElementById("formula").value;


let area=document.getElementById("menu");


area.innerHTML="";



// tampil menu formula


if(nama!=""){


for(let x in formula[nama]){


buatMenu(
x,
formula[nama][x]
);


}


}


// tampil menu tetap


for(let x in menuTetap){


buatMenu(
x,
menuTetap[x]
);


}



}




function buatMenu(judul,link){


let a=document.createElement("a");


a.className="menu";

a.href=link;

a.target="_blank";

a.innerHTML=judul;


document.getElementById("menu").appendChild(a);


}



</script>


</body>

</html>
